name: ReelBot

on:  # schedules run because the repo is public (free plans do not run them in private repos)
  schedule:                  # three reels a day; each run also reads the results of earlier reels
    # Each run starts about 70 minutes early and holds the finished reel until its time in posting.times
    # (11:00, 1:00 pm, 7:00 pm India time), because GitHub often starts timed runs late.
    - cron: "17 4 * * *"     # 9:47 am India time  -> goes live 11:00 am
    - cron: "17 6 * * *"     # 11:47 am India time -> goes live 1:00 pm
    - cron: "17 12 * * *"    # 5:47 pm India time  -> goes live 7:00 pm
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Make the reel but do not post it"
        type: boolean
        default: false
      check_only:
        description: "Only test the Instagram and Claude connections"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: reelbot

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code
          playwright install --with-deps chromium
          pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install omnivoice soundfile
      - uses: actions/cache@v4
        with:
          path: voices
          key: voices-${{ hashFiles('config.yaml') }}
      - uses: actions/cache@v4        # the voice model (about 3 GB) is downloaded once, then reused
        with:
          path: ~/.cache/huggingface
          key: hf-omnivoice-v1
      - name: Get the 5-minute stats
        run: git fetch -q --depth 1 origin stats && git worktree add -q --detach stats-data FETCH_HEAD || echo "no stats branch yet"
      - name: Remember the Telegram chat
        id: tgc
        uses: actions/cache/restore@v4
        with:
          path: .tgchat/tg_chat
          key: tg-chat-v1
      - name: Run one cycle
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          VOICEMAKER_API_KEY: ${{ secrets.VOICEMAKER_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          IG_USER_ID: ${{ secrets.IG_USER_ID || '17841416319314274' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_CHAT_FILE: .tgchat/tg_chat
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PYTHONUNBUFFERED: "1"
          # Posts only when the Instagram token is set and dry_run is not ticked
          DRY_RUN: ${{ inputs.dry_run || secrets.IG_ACCESS_TOKEN == '' }}
        run: python -m reelbot ${{ inputs.check_only && 'check' || 'run' }}
      - name: Save results and report
        if: always()
        run: |
          git config user.name "reelbot"
          git config user.email "reelbot@users.noreply.github.com"
          git add -A data
          if [ -d queue ]; then git add -A queue; fi
          git diff --cached --quiet || git commit -m "ReelBot: update results"
          for i in 1 2 3; do git pull -q --rebase --autostash origin main && git push -q && break; sleep 5; done
      - name: Keep the video for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_id }}
          path: out/*.mp4
          retention-days: 7
          if-no-files-found: ignore
      - name: Tell me on Telegram if it failed
        if: failure() && !inputs.check_only
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_CHAT_FILE: .tgchat/tg_chat
        run: python -m reelbot alert "Reel run" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Save the Telegram chat
        if: always() && steps.tgc.outputs.cache-hit != 'true' && hashFiles('.tgchat/tg_chat') != ''
        uses: actions/cache/save@v4
        with:
          path: .tgchat/tg_chat
          key: tg-chat-v1
