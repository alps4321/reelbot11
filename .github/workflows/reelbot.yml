name: ReelBot

on:
  schedule:
    - cron: "30 13 * * *"   # every day 7:00 pm India time (13:30 UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Make the reel but do not post it"
        type: boolean
        default: false
      check_only:
        description: "Only test the Instagram and Claude connections"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: reelbot

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code
          playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: voices
          key: voices-${{ hashFiles('config.yaml') }}
      - name: Run one cycle
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          VOICEMAKER_API_KEY: ${{ secrets.VOICEMAKER_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          IG_USER_ID: ${{ secrets.IG_USER_ID || '17841416319314274' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # Posts only when the Instagram token is set and dry_run is not ticked
          DRY_RUN: ${{ inputs.dry_run || secrets.IG_ACCESS_TOKEN == '' }}
        run: python -m reelbot ${{ inputs.check_only && 'check' || 'run' }}
      - name: Save results and report
        if: always()
        run: |
          git config user.name "reelbot"
          git config user.email "reelbot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "ReelBot: update results"
          git pull --rebase --autostash origin main
          git push
      - name: Keep the video for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_id }}
          path: out/*.mp4
          retention-days: 7
          if-no-files-found: ignore
