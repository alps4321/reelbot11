name: Reel scout

on:
  schedule:
    - cron: "41 3 * * *"     # 9:11 am India time, before the first reel of the day is written
  workflow_dispatch:
    inputs:
      probe:
        description: "Only test which creator accounts can be read"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q requests pyyaml faster-whisper
          npm install -g @anthropic-ai/claude-code
      - uses: actions/cache@v4        # the speech-to-text model is downloaded once
        with:
          path: ~/.cache/huggingface
          key: hf-whisper-small-v1
      - name: Remember the Telegram chat
        id: tgc
        uses: actions/cache/restore@v4
        with:
          path: .tgchat/tg_chat
          key: tg-chat-v1
      - name: Study the niche
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID || '17841416319314274' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_CHAT_FILE: .tgchat/tg_chat
          PYTHONUNBUFFERED: "1"
        run: python -m reelbot scout ${{ inputs.probe && '--probe' || '' }}
      - name: Save what was learned
        if: always()
        run: |
          git config user.name "reelbot"
          git config user.email "reelbot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -q -m "Scout: new ideas from the niche"
          for i in 1 2 3; do git pull -q --rebase --autostash origin main && git push -q && break; sleep 5; done
      - name: Tell me on Telegram if it failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_CHAT_FILE: .tgchat/tg_chat
        run: python -m reelbot alert "Reel scout" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
