# ReelBot settings. Edit this file to change what the bot makes and posts.

brand:
  name: iLoveDocuments
  url: ilovedocuments.ai
  tagline: Every PDF and image tool you need, free and private
  background: "#0D121E"      # dark navy from the site
  background2: "#16233F"
  accent: "#FFC233"          # highlight colour for key words
  text: "#FFFFFF"

content:
  style: explainer           # explainer (flat hand-drawn explainer, from 19 Nov 2026) | story3d | cards
  # One reel per language per day. Each language learns from its own results.
  languages:
    - id: english
      write_in: Simple Indian English
      voicemaker_voice: ai3-en-IN-Prabhas  # set provider: voicemaker here to use it
      azure_voice: en-IN-PrabhatNeural   # or en-IN-NeerjaNeural (female)
      kokoro_voice: am_michael     # others: af_heart, bf_emma, am_fenrir
      kokoro_lang: en-us
      piper_voice: en_US-lessac-medium
      elevenlabs_voice_id: ""
    - id: hinglish
      write_in: >
        Hinglish, the everyday mix of Hindi and common English words that young
        Indians speak. On-screen text and captions in Roman letters.
      tts_script: Devanagari    # the voice engine reads Hindi script
      voicemaker_voice: ai3-hi-IN-Madhur
      azure_voice: hi-IN-MadhurNeural    # or hi-IN-SwaraNeural (female)
      kokoro_voice: hm_omega       # others: hf_alpha, hf_beta, hm_psi
      kokoro_lang: hi
      piper_voice: hi_IN-pratham-medium
      elevenlabs_voice_id: ""
  audience: >
    People in India filling online forms (exam, government, job, passport)
    who need a PDF, photo or signature to meet a size or format rule.
  voice_and_tone: Plain, friendly, fast. Short sentences. No hype words.
  facts:                      # the only product claims a script may make
    - Free to use, no sign-up, no watermark
    - Files are processed in the browser on your device and are not uploaded
    - Works on mobile and desktop
    - 45 PDF and image tools on one site
    - "Verified answer: Aadhaar (e-Aadhaar) PDF password = first 4 letters of the name in CAPITAL letters + year of birth (YYYY), e.g. Rahul, 1998 -> RAHU1998"
    - "Verified answer: e-PAN PDF password = date of birth as DDMMYYYY, e.g. 15 August 1990 -> 15081990"
  cta: "Free. No sign-up. No watermark."
  hashtags: ["#pdf", "#onlineform", "#studenthacks", "#govtexam", "#techtips"]
  max_hashtags: 5
  target_seconds: [17, 24]
  # Each topic is one "arm" the bot tests and learns from.
  # All 45 tools on ilovedocuments.ai, in the order they get their first test.
  # searches = monthly Google searches in India (OpenSEO, Nov 2026); used only to choose the test order.
  topics:
    - {id: jpg_to_pdf, tool: "JPG to PDF", title: "Turn phone photos of documents into one PDF", searches: 7480000}
    - {id: passport_photo, tool: "Passport Photo Maker", title: "Make a passport or visa size photo at home", searches: 301000}
    - {id: pdf_to_word, tool: "PDF to Word", title: "Make a PDF editable as a Word file", searches: 6120000}
    - {id: remove_background, tool: "Remove Background", title: "Remove a photo background for ID photos", searches: 6120000}
    - {id: compress_pdf_kb, tool: "Compress PDF", title: "Shrink a PDF to an exact size like 100 KB or 200 KB", searches: 135000}
    - {id: merge_pdf, tool: "Merge PDF", title: "Combine several PDFs and photos into one file", searches: 3350000}
    - {id: resize_image_kb, tool: "Resize Image in KB", title: "Hit an exact KB limit for an online form", searches: 301000}
    - {id: pdf_to_jpg, tool: "PDF to JPG", title: "Save PDF pages as images", searches: 4090000}
    - {id: word_to_pdf, tool: "Word to PDF", title: "Convert a Word file to PDF", searches: 3350000}
    - {id: unlock_pdf, tool: "Unlock PDF", title: "Remove the password from a PDF you can open", searches: 450000}
    - {id: image_to_pdf, tool: "Image to PDF", title: "Convert images of any format into one PDF", searches: 2740000}
    - {id: pdf_to_excel, tool: "PDF to Excel", title: "Pull tables out of a PDF into Excel", searches: 1220000}
    - {id: bank_statement_excel, tool: "Bank Statement Converter", title: "Turn a bank statement PDF into one Excel sheet", searches: 5400}
    - {id: compress_image, tool: "Compress Image", title: "Shrink a photo without it looking bad", searches: 673000}
    - {id: convert_image, tool: "Convert Image", title: "Convert iPhone HEIC photos to JPG in bulk", searches: 201000}
    - {id: split_pdf, tool: "Split PDF", title: "Break a big PDF into separate files", searches: 673000}
    - {id: sign_pdf, tool: "Sign PDF", title: "Sign a PDF on the phone without printing it", searches: 27100}
    - {id: delete_pages, tool: "Delete PDF Pages", title: "Remove unwanted pages from a PDF", searches: 550000}
    - {id: edit_pdf, tool: "Edit PDF", title: "Add text, images and highlights to a PDF", searches: 550000}
    - {id: id_card_print, tool: "ID Card Print", title: "Print an ID card front and back on one A4 page"}
    - {id: resize_signature_kb, tool: "Resize Signature to 10-20 KB", title: "Get a signature under 20 KB for exam forms", searches: 1600}
    - {id: resize_image, tool: "Resize Image", title: "Change a photo's size in pixels, cm or inches", searches: 1500000}
    - {id: excel_to_pdf, tool: "Excel to PDF", title: "Turn a spreadsheet into a clean PDF", searches: 1000000}
    - {id: crop_pdf, tool: "Crop PDF", title: "Trim the margins of a PDF", searches: 368000}
    - {id: ppt_to_pdf, tool: "PowerPoint to PDF", title: "Convert slides to PDF", searches: 246000}
    - {id: pdf_to_ppt, tool: "PDF to PowerPoint", title: "Turn a PDF into editable slides", searches: 201000}
    - {id: png_to_pdf, tool: "PNG to PDF", title: "Convert screenshots to PDF", searches: 165000}
    - {id: rotate_pdf, tool: "Rotate PDF", title: "Fix sideways or upside-down scanned pages", searches: 90500}
    - {id: crop_image, tool: "Crop Image", title: "Crop a photo to a set ratio", searches: 90500}
    - {id: extract_pages, tool: "Extract PDF Pages", title: "Save only the pages you need as a new PDF", searches: 74000}
    - {id: pdf_to_png, tool: "PDF to PNG", title: "Save PDF pages as PNG images", searches: 74000}
    - {id: unlock_aadhaar, tool: "Unlock Aadhaar PDF", title: "Open the e-Aadhaar PDF and remove its password", searches: 22200}
    - {id: watermark_pdf, tool: "Watermark PDF", title: "Add a name or logo across PDF pages", searches: 18100}
    - {id: pdf_to_text, tool: "PDF to Text", title: "Extract all the text from a PDF", searches: 18100}
    - {id: repair_pdf, tool: "Repair PDF", title: "Recover a PDF that will not open", searches: 14800}
    - {id: protect_pdf, tool: "Protect PDF", title: "Lock a PDF with a password before sending it", searches: 12100}
    - {id: add_page_numbers, tool: "Add Page Numbers", title: "Number the pages of a PDF", searches: 12100}
    - {id: extract_images, tool: "Extract Images from PDF", title: "Save the pictures embedded in a PDF", searches: 12100}
    - {id: rotate_image, tool: "Rotate Image", title: "Rotate or flip a photo", searches: 12100}
    - {id: signature_bg_remover, tool: "Signature Background Remover", title: "Clean up a photographed signature", searches: 6600}
    - {id: edit_image, tool: "Edit Image", title: "Change DPI, go black and white, remove hidden photo data", searches: 6600}
    - {id: organize_pdf, tool: "Organize PDF", title: "Reorder and rotate PDF pages visually", searches: 5400}
    - {id: redact_pdf, tool: "Redact PDF", title: "Permanently black out private details before sharing a document", searches: 3600}
    - {id: resize_photo_kb, tool: "Resize Photo to 20-50 KB", title: "Resize an exam or passport photo to 20-50 KB", searches: 590}
    - {id: ocr_pdf, tool: "OCR PDF", title: "Copy text out of a scanned PDF in Hindi, Gujarati or English", searches: 20}
  hook_styles: [question, bold_claim, story_open, contrarian, number, problem, how_to]
  # How far an explainer reel may wander from its tool before the plug at the end. Tested like hooks.
  distances:
    near: "The story stays in the tool's world (forms, documents, photos, uploads), but it is a fact, a story or a lesson worth watching on its own, not a demo of the tool."
  # Story structures for explainer reels. Tested and scored like hooks; never the same one twice in a day.
  explainer_formats:
    secret_answer: "THE PROVEN FORMULA (our best reel: Aadhaar PDF password, 1,966 views, 18 shares, 24 saves). Sentence 1 is the exact question people search, in their words ('Aadhaar PDF ka password kya hota hai?'). Then 2-3 short sentences of tension: what people try that fails, why it matters right now. Then the exact answer with a worked example on screen (Rahul, 1998 -> RAHU1998). Then 'save kar lo' and the site for the related tool. THE ANSWER MUST BE A REAL SECRET the viewer can use even without our site (a password format, an exact rule, a number, a hidden setting) and it must be one of the verified answers. 'Use our tool' is never the answer: the tool comes after the answer, as the easy way. Put the answer by sentence 4 at the latest, and tease it in sentence 2 (\"answer end mein hai\")."
    discovery: "A find: a free trick, setting or way of doing something most people don't know. What it does, why it matters, then the plug."
    myth_buster: "Open with something most people believe. Show with one concrete example why it is wrong. Give the right way. Then the plug."
    story: "A tiny story about one person (Indian first name) with a turn in the middle and a lesson at the end. The plug is the lesson's tool."
    did_you_know: "One surprising, true fact. Then two or three sentences on why it matters to the viewer. Then the plug."
    three_things: "Three quick tips or rules, numbered, one drawing each, building to the best one. The plug comes after the third."
    versus: "Two ways of doing the same thing. Build the comparison, then reveal the clear winner. Then the plug."
    mistake: "Start with 'Stop doing X.' The common mistake, what it costs people, the fix. Then the plug."
    behind_the_scenes: "Explain how something everyday really works (why forms set KB limits, what a PDF actually is, why phone photos are so big). Then the plug."
  formats: [secret_answer, what_if, deadline_story, two_friends, boss_junior, explainer]   # story3d formats
  card_formats: [problem_fix, three_mistakes, before_after, myth_buster]

research:
  refresh_days: 3
  hashtags: [pdf, onlineform, sscexam, govtjobs, studytips]   # max 30 different per week (Meta limit)
  # Business/creator accounts the daily scout studies (all checked readable on 17 Nov 2026)
  competitors: [iamchrischung, smallpdf, adobeacrobat, canva, trakintech, manojsaru, beebomco, techburner,
                technicalguruji, gadgetstouse, techwiser, sharmajitechnical, testbookdotcom, unacademy, physicswallah]
  # Accounts to try once with `python -m reelbot scout --probe`; the readable ones move to competitors.
  candidates: [iamchrischung, ilovepdf, smallpdf, adobeacrobat, canva, trakintech, manojsaru, beebomco, techburner,
               technicalguruji, geekyranjit, techno_ruhez, gadgetstouse, techwiser, sharmajitechnical, adda247,
               testbookdotcom, unacademy, careerwill, physicswallah, studyiq_education, careers360_official]
  keep_top: 25

voice:
  provider: omnivoice        # omnivoice (free, one consistent voice) | kokoro | piper | azure | elevenlabs | none
  omnivoice_ref: assets/narrator/hi_male_ref.wav      # the male voice you picked; every line copies it
  omnivoice_ref_text: "ग्यारह उनसठ पर फॉर्म रिजेक्ट।"
  speed: 0.94                # slightly slower than the model's default
  omnivoice_steps: 16        # 16 sounds the same as 32 in tests and takes half the time
  sound_effects: true        # whoosh, pop, error buzz, success ding

posting:
  enabled: true              # master switch. false = bot does nothing
  dry_run: false             # true = make videos but never post
  slots: [hinglish, english, hinglish]   # three reels a day, in this order
  times: ["11:00", "13:00", "19:00"]
  proven_slots: ["11:00", "19:00"]   # these use the proven formula; the other slot keeps testing new ideas     # India time each reel goes live; the reel is made earlier and held until then
  winner_days: [1, 4]        # from week 2: Tuesday and Friday go to the best-scoring tool (Monday = 0)
  share_to_feed: true
  label_ai_generated: true

notify:                      # Telegram updates (free). Needs the TELEGRAM_BOT_TOKEN secret; see README
  digest_hours: [8, 11, 14, 17, 20, 23]  # India time of the every-3-hours summary (quiet at night)
  on_post: true              # message when a reel goes live
  on_failure: true           # message when a run fails

learning:
  check_hours: [6, 24, 48, 72, 120, 168]   # hours after posting when each reel's results are read
  explore_rate: 0.25         # share of posts that try something not yet proven
  min_posts_for_playbook: 4

claude:
  model: claude-sonnet-5-5   # used only with an API key; the subscription token uses your plan's default
